# Localização no mapa estático para a base mecanum CBR.
# Usar com nav2_bringup/launch/localization_launch.py.

amcl:
  ros__parameters:
    use_sim_time: false
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan_front
    tf_broadcast: true
    transform_tolerance: 0.5
    # A arena de competição possui ponto de partida conhecido. Substitua os
    # valores abaixo pelos medidos antes de habilitar o perfil autônomo.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

    # A mecanum pode transladar lateralmente; não usar o modelo diferencial.
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha1: 0.08
    alpha2: 0.08
    alpha3: 0.12
    alpha4: 0.12
    alpha5: 0.08

    # O XV-11 fornece 360° e mede até 3 m.
    laser_model_type: likelihood_field
    laser_min_range: 0.10
    laser_max_range: 3.0
    laser_likelihood_max_dist: 2.0
    max_beams: 90
    z_hit: 0.75
    z_rand: 0.20
    z_max: 0.05
    z_short: 0.0
    sigma_hit: 0.15
    lambda_short: 0.1
    do_beamskip: false

    min_particles: 300
    max_particles: 1500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    update_min_d: 0.05
    update_min_a: 0.05
    save_pose_rate: 0.5

map_server:
  ros__parameters:
    use_sim_time: false

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [map_server, amcl]
