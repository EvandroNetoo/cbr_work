schema_version: 1

pickup:
  tabletop:
    observation_state: detect_apriltags
    approach_height_m: 0.08
    cube_size_m: 0.042
    yaw_offset_deg: -90.0
    attempts: 1
    # RL, CP e CL exclusivos da coleta; calibrar independentemente do depósito.
    reachability_filter_enabled: true
    reach_center_x_m: 0.0
    reach_center_y_m: 0.0
    reach_min_radius_m: 0.155
    reach_max_radius_m: 0.28
    # valor alto para não limitar a busca de espaço livre; calibrar se necessário.
    reach_x_min_m: -1
    reach_x_max_m: 1
    reach_y_min_m: -1
    reach_y_max_m: 0

  shelf_front:
    strategy: front
    observation_state: detect_apriltags
    # Pose padrão ilustrativa no SRDF; ajustar no robô antes da coleta.
    pre_grasp_state: pick_shelf_front_ready
    approach_height_m: 0.08
    cube_size_m: 0.042
    # Z do TCP = Z da tag (no topo) - metade do cubo + este ajuste.
    grasp_z_offset_m: 0.0
    # Y do TCP = Y detectado + offset; positivo aproxima o alvo do corpo.
    grasp_y_offset_m: -0.02
    link3_to_link4_deg: 85.0
    link4_to_link5_deg: 90.0
    joint_tolerance_deg: 2.5
    attempts: 1
    # SH: após confirmar o alinhamento, enviar diretamente ao MoveIt.
    reachability_filter_enabled: false
    reach_center_x_m: 0.0
    reach_center_y_m: 0.0
    reach_min_radius_m: 0.155
    reach_max_radius_m: 0.28
    reach_x_min_m: -1
    reach_x_max_m: 1
    reach_y_min_m: -1
    reach_y_max_m: 0

placements:
  table:
    strategy: perception
    # Altura de soltura após o alinhamento externo.
    enabled: true
    tcp_release_offset_cm: -7.5
    # Região segura e alcançável para buscar espaço livre. Calibrar os vazios.
    # Meias dimensões da área ocupada pela garra/TCP com yaw 0°.
    # Ao testar o yaw alternativo, os eixos são girados junto com a garra.
    free_space_half_extent_x_m: 0.065
    free_space_half_extent_y_m: 0.025
    # Distância adicional obrigatória entre a garra e os obstáculos.
    free_space_min_padding_m: 0.01
    free_space_preferred_padding_m: 0.04
    # Em cada posição sorteada, testar nesta ordem.
    free_space_preferred_yaw_deg: -90.0
    free_space_alternate_yaw_deg: 0.0
    # Faixa de alcance XY em torno do centro do braço.
    reach_center_x_m: 0.0
    reach_center_y_m: 0.0
    reach_min_radius_m: 0.155
    reach_max_radius_m: 0.28
    search_x_min_m: -0.28
    search_x_max_m: 0.28
    search_y_min_m: -0.24
    search_y_max_m: -0.10
    search_step_m: 0.01
    approach_height_m: 0.06
    retreat_height_m: 0.06

  explicit_pose:
    strategy: cartesian
    enabled: true
    approach_height_m: 0.08
    retreat_height_m: 0.08
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 0.0

  container:
    strategy: perception
    # X/Y partem da detecção; Z = altura da mesa + altura externa + offset Z.
    # Verificar a queda na abertura no robô.
    enabled: true
    calibrated_reference: true
    reference_offset_xyz: [0.0, 0.0, 0.10]
    # Durante a soltura, esta junta não pode superar o limite configurado.
    link3_to_link4_max_deg: 0.0
    # Partial image-edge contours may be targets when the fit is plausible.

  stack:
    strategy: tag_relative
    # Offset calibrado do TCP em relação à tag do cubo de apoio.
    enabled: true
    # 0 pula a aproximação elevada e move diretamente à pose de soltura.
    approach_height_m: 0.0
    # 0 pula a elevação após soltar e retorna diretamente a detect_apriltags.
    retreat_height_m: 0.0
    calibrated_reference: true
    reference_offset_xyz: [0.0, 0.0, 0.02]
    yaw_offset_deg: 0.0
    # Tolerância de inclinação na soltura, em graus, independente da coleta
    # e dos outros depósitos. Ex.: 5.0. null mantém o padrão (~11.46 graus).
    # A aproximação e a retirada mantêm a tolerância de 35 graus.
    tilt_tolerance_deg: 30

  precision_table:
    strategy: tag_relative
    enabled: true
    # Calibrar a pose de soltura do TCP em relação à tag da mesa PP.
    # Somar XYZ em arm_base_link, em metros (não nos eixos locais da tag).
    calibrated_reference: true
    reference_offset_xyz: [0.0, 0.067, -0.010]
    yaw_offset_deg: 0.0
    approach_height_m: 0.015
    retreat_height_m: 0.0
    tilt_tolerance_deg: null

    # Rebolada da base com a garra fechada, antes de soltar o cubo.
    base_wiggle:
      enabled: true
      radius_m: 0.01
      cycles: 2
      period_s: 2.0
      max_speed_m_s: 0.1
      settle_s: 0.3
      rate_hz: 30.0

  shelf:
    strategy: named_state
    # Pose alta FICTÍCIA: substituir as juntas de place_on_shelf_high no SRDF
    # após calibrar o depósito na SH, antes de executar no robô.
    enabled: true
    named_state: "place_on_shelf_high"
    approach_height_m: 0.08
    retreat_height_m: 0.10
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 90.0
