mission_face_node:
  ros__parameters:
    mission_state_topic: /mission/state
    mission_active_topic: /mission/active
    show_menu_when_idle: true
    i2c_bus: 0
    i2c_address: 0x3C
    fps: 20.0
    retry_interval_sec: 5.0

    # Edite os rostos abaixo e reinicie o launch da base para aplicar.
    # Rostos: nomes das operações abaixo, piscar, piscadinha e comemorar.
    # Todos animados. Nomes antigos (neutro, feliz, bravo etc.) são aceitos.
    expressions:
      idle: neutro               # Aguardando missão ou missão encerrada.
      disconnected: neutro       # Publicador da missão desconectado.
      unknown_state: triste      # Estado da carga incerto (tem prioridade).
      unknown_operation: neutro  # Operação sem mapeamento abaixo.

      # Nome da operação publicada em /mission/state: rosto desejado.
      operations:
        navigate: navigate                                   # Navegando entre estações.
        finish: finish                                       # Indo até a posição final.
        follow_wall: follow_wall                             # Deslocando junto à parede.
        analyze_scene: analyze_scene                         # Analisando a cena.
        pick: pick                                           # Coletando objeto.
        store: store                                         # Guardando na base.
        retrieve: retrieve                                   # Recuperando objeto da base.
        place_on_table: place_on_table                       # Entregando na mesa.
        place_in_container: place_in_container               # Entregando no recipiente.
        place_on_shelf: place_on_shelf                       # Entregando na prateleira.
        place_on_precision_table: place_on_precision_table   # Posicionando com precisão.
        stack: stack                                         # Empilhando.
        organize_precision: organize_precision               # Organizando a mesa de precisão.
