controller_manager:
  ros__parameters:
    use_sim_time: false
    update_rate: 30
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    base_controller:
      type: mecanum_drive_controller/MecanumDriveController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
      - base_link_to_link1
      - link1_to_link2
      - link2_to_link3
      - link3_to_link4
      - link4_to_link5
      - right_clamp
    interfaces: [position, velocity]

arm_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 30.0
    joints:
      - base_link_to_link1
      - link1_to_link2
      - link2_to_link3
      - link3_to_link4
      - link4_to_link5

gripper_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 30.0
    joints: [right_clamp]

base_controller:
  ros__parameters:
    reference_timeout: 0.25
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    front_left_wheel_state_joint_name: front_left_wheel_joint
    front_right_wheel_state_joint_name: front_right_wheel_joint
    rear_right_wheel_state_joint_name: rear_right_wheel_joint
    rear_left_wheel_state_joint_name: rear_left_wheel_joint
    kinematics:
      wheels_radius: 0.034
      sum_of_robot_center_projection_on_X_Y_axis: 0.2225
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    tf_frame_prefix_enable: false
