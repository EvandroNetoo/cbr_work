so101_hardware_node:
  ros__parameters:
    # Fonte padrão; use port:=... na CLI somente para uma substituição pontual.
    port: '/dev/serial/by-path/platform-5200000.usb-usb-0:1.1.1:1.0-port0'
    robot_id: so101_follower
    # Nomes relativos são resolvidos dentro de share/so_arm_101_hardware/config.
    calibration_file: so101_follower.json
    # ROS uses radians; the adapter converts to/from LeRobot degrees.
    use_degrees: true
    # A escrita acompanha os setpoints interpolados pelo controller_manager.
    write_rate_hz: 30.0
    # Durante movimento, mantém feedback suficiente para o ros2_control.
    read_rate_hz: 10.0
    # Em repouso, reduz sync_read e publicação de estado para poupar CPU/serial.
    idle_read_rate_hz: 2.0
    read_idle_timeout_sec: 1.0
    idle_velocity_threshold: 0.02
    # O callback mantém somente o alvo mais recente; um único ciclo usa a serial.
    # Tenta recriar a conexão por até 5 s, uma vez por segundo.
    reconnect_interval_sec: 1.0
    reconnect_timeout_sec: 5.0
    state_topic: /so101_hardware/raw_joint_states
    command_topic: /so101_hardware/command_positions
