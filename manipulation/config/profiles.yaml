schema_version: 1

pickup:
  tabletop:
    observation_state: detect_apriltags
    approach_height_m: 0.08
    cube_size_m: 0.042
    yaw_offset_deg: 0.0
    attempts: 1
    # RL, CP e CL exclusivos da coleta; calibrar independentemente do depósito.
    reachability_filter_enabled: true
    reach_center_x_m: 0.0
    reach_center_y_m: 0.0
    reach_min_radius_m: 0.155
    reach_max_radius_m: 0.28
    # valor alto para não limitar a busca de espaço livre; calibrar se necessário.
    reach_x_min_m: -1
    reach_x_max_m: 1
    reach_y_min_m: -1
    reach_y_max_m: 0

placements:
  table:
    strategy: perception
    # Pose nominal após o alinhamento externo. Preencher após calibrar.
    enabled: true
    release_x_m: 0.0
    release_y_m: -0.20
    release_yaw_deg: 0.0
    tcp_release_offset_cm: -7.5
    # Região segura e alcançável para buscar espaço livre. Calibrar os vazios.
    free_space_min_distance_m: 0.07
    free_space_preferred_distance_m: 0.10
    # Faixa de alcance XY em torno do centro do braço.
    reach_center_x_m: 0.0
    reach_center_y_m: 0.0
    reach_min_radius_m: 0.155
    reach_max_radius_m: 0.28
    search_x_min_m: -0.2
    search_x_max_m: 0.2
    search_y_min_m: -0.27
    search_y_max_m: -0.17
    search_step_m: 0.01
    obstacle_uncertainty_m: 0.01
    # Envelope XY conservador do URDF/meshes com link5 deslocado do TCP.
    gripper_footprint_x_m: 0.13
    gripper_footprint_y_m: 0.25
    # Limites REAIS da superfície utilizável em arm_base_link: ainda não
    # medidos. Sem eles o depósito na mesa falha fechado antes de mover.
    usable_x_min_m: null
    usable_x_max_m: null
    usable_y_min_m: null
    usable_y_max_m: null
    approach_height_m: 0.06
    retreat_height_m: 0.06

  explicit_pose:
    strategy: cartesian
    enabled: true
    approach_height_m: 0.08
    retreat_height_m: 0.08
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 0.0

  container:
    strategy: perception
    enabled: true
    approach_height_m: 0.10
    retreat_height_m: 0.10
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 90.0
    # Valor inicial deliberadamente não calibrado no robô físico.
    placement_offset_m: 0.0
    minimum_detection_confidence: 0.45
    maximum_detection_age_s: 3.0

  stack:
    strategy: tag_relative
    # Offset calibrado do TCP em relação à tag do cubo de apoio.
    enabled: true
    approach_height_m: 0.03
    retreat_height_m: 0.08
    calibrated_reference: true
    reference_offset_xyz: [0.0, 0.0, 0.01]
    yaw_offset_deg: 0.0

  shelf:
    strategy: named_state
    # Habilitar e preencher named_state após medir a pose fixa da prateleira.
    enabled: false
    named_state: ""
    approach_height_m: 0.08
    retreat_height_m: 0.10
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 90.0
