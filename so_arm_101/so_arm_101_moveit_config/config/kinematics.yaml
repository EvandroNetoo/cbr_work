arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  # O braço tem 5 DOF; resolver uma pose completa (XYZ + orientação) exigiria
  # 6 DOF. A orientação permanece livre e a IK resolve as coordenadas XYZ.
  position_only_ik: true

arm_container:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1
  # O tip deste grupo é o gripper_tcp_near, evitando converter um offset
  # entre TCPs com uma orientação que a IK position-only não preserva.
  position_only_ik: true
