<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="297mm" height="210mm" viewBox="0 0 297 210">
  <title>8x6 internal-corner calibration checkerboard, 25 mm squares</title>
  <desc>Print on A4 landscape at 100 percent scale. The board is 225 by 175 mm.</desc>
  <defs>
    <pattern id="checker" x="36" y="17.5" width="50" height="50"
             patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="25" height="25" fill="#000"/>
      <rect x="25" y="25" width="25" height="25" fill="#000"/>
    </pattern>
  </defs>

  <rect width="297" height="210" fill="#fff"/>
  <!-- 9 x 7 squares produce 8 x 6 internal corners. -->
  <rect x="36" y="17.5" width="225" height="175"
        fill="url(#checker)"/>

  <!-- This line must measure exactly 100 mm after printing. -->
  <line x1="98.5" y1="201" x2="198.5" y2="201"
        stroke="#000" stroke-width="0.4"/>
  <line x1="98.5" y1="198.5" x2="98.5" y2="203.5"
        stroke="#000" stroke-width="0.4"/>
  <line x1="198.5" y1="198.5" x2="198.5" y2="203.5"
        stroke="#000" stroke-width="0.4"/>
  <text x="148.5" y="207" text-anchor="middle"
        font-family="sans-serif" font-size="3.5">controle: 100 mm</text>
</svg>
