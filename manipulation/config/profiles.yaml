schema_version: 1

pickup:
  tabletop:
    observation_state: detect_apriltags
    approach_height_m: 0.08
    cube_size_m: 0.042
    yaw_offset_deg: 0.0
    attempts: 2

placements:
  table:
    strategy: perception
    # Pose nominal após o alinhamento externo. Preencher após calibrar.
    enabled: true
    release_x_m: 0.0
    release_y_m: -0.20
    release_yaw_deg: 0.0
    tcp_release_offset_cm: -7.5
    # Região segura e alcançável para buscar espaço livre. Calibrar os vazios.
    free_space_min_distance_m: 0.08
    free_space_preferred_distance_m: 0.12
    # Faixa de alcance XY em torno do centro do braço (CP=0.16 m, CL=0.24 m).
    reach_center_x_m: 0.0
    reach_center_y_m: 0.0
    reach_min_radius_m: 0.15
    reach_max_radius_m: 0.30
    search_x_min_m: -0.2
    search_x_max_m: 0.2
    search_y_min_m: -0.30
    search_y_max_m: -0.10
    search_step_m: 0.01
    approach_height_m: 0.07
    retreat_height_m: 0.07

  explicit_pose:
    strategy: cartesian
    enabled: true
    approach_height_m: 0.08
    retreat_height_m: 0.08
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 0.0

  container:
    strategy: perception
    # Habilitar somente quando a detecção de contêiner estiver disponível.
    enabled: false
    approach_height_m: 0.10
    retreat_height_m: 0.10
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 90.0

  stack:
    strategy: tag_relative
    # Offset calibrado do TCP em relação à tag do cubo de apoio.
    enabled: true
    approach_height_m: 0.03
    retreat_height_m: 0.08
    calibrated_reference: true
    reference_offset_xyz: [0.0, 0.0, 0.03]
    yaw_offset_deg: 0.0

  shelf:
    strategy: named_state
    # Habilitar e preencher named_state após medir a pose fixa da prateleira.
    enabled: false
    named_state: ""
    approach_height_m: 0.08
    retreat_height_m: 0.10
    calibrated_reference: false
    reference_offset_xyz: [0.0, 0.0, 0.0]
    yaw_offset_deg: 90.0
