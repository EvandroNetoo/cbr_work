scene_analyzer:
  ros__parameters:
    image_topic: /camera/image_rect
    camera_info_topic: /camera/camera_info
    base_frame: base_link
    container_target_topic: /manipulation/container_release_target
    tag_frame_prefix: apriltag
    family: tag36h11
    tag_size_m: 0.032
    nthreads: 1
    quad_decimate: 1.0
    # A câmera pode entregar 30 FPS, mas a manipulação não precisa detectar
    # tags em todos eles. Frames intermediários são descartados antes de
    # conversão OpenCV e pupil_apriltags.
    max_detection_rate_hz: 10.0
    min_decision_margin: 30.0
    max_hamming: 0
    # Publica a entrada mono do detector com candidatos e métricas desenhados.
    publish_debug_image: true
    feedback_rate_hz: 5.0
    suppress_native_pose_warning: true

    # Mantém o processo carregado, mas para a captura USB quando não há ação.
    manage_camera_capture: true
    camera_capture_service: /camera/set_capture
    camera_capture_timeout_sec: 5.0
    # Pare a USB camera assim que a ação terminar; o detector remove suas
    # assinaturas no mesmo ciclo do executor.
    camera_idle_timeout_sec: 0.0
    camera_capture_retry_sec: 1.0

    # O base_hardware é o único dono da serial do brick. O detector apenas
    # solicita iluminação no início e desligamento no fim de cada ação.
    manage_vision_led: true
    vision_led_service: /base_hardware/set_vision_led
    vision_led_timeout_sec: 5.0

    # Bin 3 geometry. The first placement-safe version fits the external
    # silhouette; internal dimensions are retained for the later opening model.
    external_height_m: 0.073
    external_width_m: 0.102
    external_depth_m: 0.173
    internal_height_m: 0.057
    internal_width_m: 0.090
    internal_depth_m: 0.140

    # Initial HSV thresholds; calibrate with the real camera and vision LED.
    min_saturation: 80
    min_value: 30
    red_hue_low_1: 0
    red_hue_high_1: 15
    red_hue_low_2: 140
    red_hue_high_2: 179
    blue_hue_low: 70
    blue_hue_high: 138
    morphology_kernel_px: 5
    min_contour_area_px: 6500.0
    min_partial_contour_area_px: 2500.0
    # Stabilizes edge classification against mask jitter between frames.
    container_border_margin_px: 6
    max_contour_area_fraction: 0.85
    min_rectangularity: 0.55
    polygon_epsilon_fraction: 0.035
    max_container_pose_error_px: 12.0

    # Aguarda exposição/balanço de branco se estabilizarem após ligar câmera e LED.
    # A janela solicitada pela action começa somente depois deste intervalo.
    container_warmup_sec: 1.0
    # Associação temporal e fusão final. Dois Bin 3 físicos não podem ter seus
    # centros a menos que a largura externa (10,2 cm) sem se sobreporem.
    container_association_distance_m: 0.07
    container_final_merge_distance_m: 0.07
    # Uma observação isolada nunca é devolvida como container confirmado.
    min_container_observations: 2
    max_container_position_deviation_m: 0.06
    # Yaw é comparado módulo 180 graus pela simetria do retângulo externo.
    max_container_yaw_deviation_deg: 20.0
