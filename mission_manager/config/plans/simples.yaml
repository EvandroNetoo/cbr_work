# na WS 4. A WS 2 possui dois contêineres; o total da missão permanece quatro.
steps:
  # WS 1: coleta os cubos 1, 2 e 10.
  - id: depositar_cubo_1_no_container_azul_ws_2
    action: place_in_container
    container_color: blue

  - id: depositar_cubo_2_no_container_azul_ws_2
    action: place_in_container
    container_color: blue

  - id: depositar_cubo_3_no_container_azul_ws_2
    action: place_in_container
    container_color: blue