schema_version: 1
frame_id: map

# Padrão usado por todas as áreas; um bloco alignment local pode sobrescrever
# somente os campos que forem diferentes.
alignment_defaults:
  distance_mm: 40
  tolerance_mm: 5
  timeout_s: 10.0

# Antes de qualquer depósito em uma SH: distância frontal medida pelo VL53.
# Cada SH pode sobrescrever os campos em shelf_place_alignment.
shelf_place_alignment_defaults:
  distance_mm: 40
  tolerance_mm: 5
  timeout_s: 10.0

# Distância segura da superfície antes de entregar novamente o movimento ao
# Nav2. Cada área pode sobrescrever estes campos em um bloco `departure`.
departure_defaults:
  distance_mm: 250
  tolerance_mm: 25
  timeout_s: 10.0
  # Coordenada lateral absoluta do centro registrado ao chegar à mesa.
  lateral_position_mm: 0
  # Proteções usadas no retorno lateral executado junto com o recuo.
  # Para desativar a proteção no recuo, defina ambos como zero.
  max_alignment_error_mm: 0
  alignment_recovery_distance_mm: 0
  minimum_lateral_clearance_mm: 10

# Se uma coleta estiver fora do alcance, centraliza novamente a AprilTag no
# referencial do braço e repete a detecção. O eixo x corrige o percurso ao
# longo da parede; o eixo y corrige a distância perpendicular à parede.
pickup_recovery:
  enabled: true
  minimum_wall_distance_mm: 25
  maximum_wall_distance_mm: 250
  # Limites laterais absolutos relativos ao alinhamento inicial (posição 0).
  minimum_lateral_position_mm: -900
  maximum_lateral_position_mm: 900
  preferred_tag_x_m: 0.0
  preferred_tag_y_m: -0.22
  # SH: alinhamento obrigatório, mesmo quando a tag já está alcançável.
  # Valores iniciais; calibrar separadamente da coleta superior.
  shelf_preferred_tag_x_m: 0.0
  shelf_preferred_tag_y_m: -0.32
  # Stack: alvo XY da tag de apoio no referencial do braço, independente da SH.
  # O alinhamento é tentado mesmo com pickup_recovery.enabled: false.
  stack_preferred_tag_x_m: 0.0
  stack_preferred_tag_y_m: -0.22
  wall_tolerance_mm: 5
  travel_tolerance_mm: 10
  timeout_s: 15.0
  max_reposition_attempts: 1
  # Coordenadas laterais absolutas relativas ao alinhamento inicial da área.
  # A próxima posição ainda não observada é escolhida pela menor distância.
  search_positions_mm: [0, 325, -325]

# Posições fixas de busca de espaço livre para place_on_table, em milímetros.
# Coleta e depósito em contêiner continuam usando pickup_recovery.search_positions_mm.
table_place_search_positions_mm: [0, 160, 325, -160, -325]

# Preencher com poses medidas no mapa antes da primeira execução.
start:
  x_m: 4.000
  y_m: 3.000
  yaw_rad: -3.14

finish:
  x_m: 4.000
  y_m: 3.000
  yaw_rad: 3.14

service_areas:
  ws_1:
    x_m: 2.2
    y_m: 2.476
    yaw_rad: 1.570
    height_cm: 6
    type: WS

  ws_2:
    x_m: 2.2
    y_m: 3.755
    yaw_rad: -1.570
    height_cm: 6
    type: WS

  ws_3:
    x_m: 2.77
    y_m: 4.11
    yaw_rad: 0.000
    height_cm: 11
    type: WS

  ws_4:
    x_m: 3.955
    y_m: 4.11
    yaw_rad: -3.14
    height_cm: 11
    type: WS

  ws_5:
    x_m: 4.422
    y_m: 4.830
    yaw_rad: 1.570
    height_cm: 16.0
    type: WS

  ws_6:
    x_m: 4.422
    y_m: 6.100
    yaw_rad: -1.570
    height_cm: 16.0
    type: WS


  sh_1:
    x_m: 1.333
    y_m: 1.414
    yaw_rad: -1.570
    height_cm: 10.0
    type: SH
    alignment:
      distance_mm: 80  

  # Exemplo completo de área de serviço (valores ilustrativos).
  # Para usar, descomente o bloco abaixo e ajuste o ID e os valores.
  # Campos de alignment/departure omitidos herdam os respectivos defaults.
  # pickup_recovery e table_place_search_positions_mm são globais;
  # não podem ser configurados dentro de uma área de serviço.
  # area_exemplo:
  #   x_m: 1.0                  # Posição X no mapa, em metros.
  #   y_m: 2.0                  # Posição Y no mapa, em metros.
  #   yaw_rad: 1.5707963268     # Orientação no mapa, em radianos.
  #   height_cm: 10.0           # Altura da superfície usada na coleta, em cm.
  #   type: SH                  # Valores aceitos: WS, SH ou PP.
  #   shelf_place_alignment:    # Somente SH; herda shelf_place_alignment_defaults.
  #     distance_mm: 40         # Distância frontal obrigatória antes do depósito.
  #   # Na SH, place_on_shelf usa a pose fixa do perfil shelf, não height_cm.
  #   alignment:
  #     distance_mm: 40         # Distância frontal desejada na chegada (> 0).
  #     tolerance_mm: 5         # Tolerância da distância frontal (> 0).
  #     timeout_s: 10.0         # Tempo limite do alinhamento, em segundos (> 0).
  #   departure:
  #     distance_mm: 250        # Distância frontal desejada antes de sair (> 0).
  #     tolerance_mm: 25        # Tolerância da distância frontal (> 0).
  #     timeout_s: 10.0         # Tempo limite do recuo, em segundos (> 0).
  #     lateral_position_mm: 0  # Destino lateral absoluto relativo à chegada.
  #     # Proteções aplicadas quando a saída inclui deslocamento lateral.
  #     max_alignment_error_mm: 100          # Erro máximo; 0 desativa o limite.
  #     alignment_recovery_distance_mm: 100  # Percurso de recuperação; 0 desativa.
  #     # Recuperação > 0 exige max_alignment_error_mm > 0.
  #     minimum_lateral_clearance_mm: 10     # Folga lateral mínima; 0 desativa.
