# SO-ARM-101 Description — Docker Compose
# Usage:
#   docker compose run build        # Build package and open shell
#   docker compose run validate     # Validate the Gazebo URDF
#   docker compose run test         # Run pytest offline tests
#   docker compose run rviz         # Launch RViz (needs X11)
#   docker compose run gazebo       # Launch Gazebo (needs X11 + GPU)

x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
    target: base
  volumes:
    - .:/ws/src/so_arm_101_description
  stdin_open: true
  tty: true

services:
  # Interactive shell with workspace built
  build:
    <<: *common
    command: bash

  # Validate the Gazebo URDF with check_urdf
  validate:
    <<: *common
    command: >
      bash -c '
        xacro /ws/src/so_arm_101_description/urdf/so_101.urdf.xacro |
        check_urdf /dev/stdin
      '

  # Run offline pytest suite
  test:
    <<: *common
    command: >
      bash -c '
        cd /ws/src/so_arm_101_description &&
        python3 -m pytest test/ -v
      '

  # Launch file parse check (no simulator needed)
  check-launch:
    <<: *common
    command: ros2 launch so_arm_101_description sim.launch.py --print

  # RViz visualization (needs DISPLAY and X11)
  rviz:
    build:
      context: .
      dockerfile: Dockerfile
      target: rviz
    volumes:
      - .:/ws/src/so_arm_101_description
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
    network_mode: host
    stdin_open: true
    tty: true
    command: ros2 launch so_arm_101_description display.launch.py

  # Gazebo simulation (needs DISPLAY and optionally GPU)
  gazebo:
    build:
      context: .
      dockerfile: Dockerfile
      target: gazebo
    volumes:
      - .:/ws/src/so_arm_101_description
    environment:
      - DISPLAY=${DISPLAY:-host.docker.internal:0}
      - GZ_SIM_RESOURCE_PATH=/ws/install/so_arm_101_description/share
    network_mode: host
    stdin_open: true
    tty: true
    # Uncomment for NVIDIA GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    command: ros2 launch so_arm_101_description sim.launch.py
