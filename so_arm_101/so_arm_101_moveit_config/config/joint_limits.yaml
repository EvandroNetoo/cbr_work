joint_limits:
  base_link_to_link1:
    has_acceleration_limits: true
    max_acceleration: 5.0
  link1_to_link2:
    has_acceleration_limits: true
    max_acceleration: 5.0
  link2_to_link3:
    has_acceleration_limits: true
    max_acceleration: 5.0
  link3_to_link4:
    has_acceleration_limits: true
    max_acceleration: 5.0
  link4_to_link5:
    has_acceleration_limits: true
    max_acceleration: 5.0
  right_clamp:
    # MoveIt 2 Jazzy checks bounded joints with zero numerical tolerance.
    # Gazebo's mimic constraint settles around the physical limit with noise
    # near 1e-8 m, so expand only the planning model by 1 micrometre.
    has_position_limits: true
    min_position: -0.000001
    max_position: 0.037001
    has_acceleration_limits: true
    max_acceleration: 0.2
  left_clamp:
    has_position_limits: true
    min_position: -0.037001
    max_position: 0.000001
