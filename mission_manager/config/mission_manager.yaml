mission_manager:
  ros__parameters:
    arena_file: ""
    plans_directory: ""
    execute_action: /mission/execute
    odometry_topic: /odom
    state_topic: /mission/state
    state_frame_id: arm_base_link
    cargo_slot_ids: [left, right]
    navigate_action: /navigate_to_pose
    wall_control_action: /vl53/follow_wall
    follow_wall.max_alignment_error_mm: 35
    follow_wall.alignment_error_ignore_sec: 1.0
    follow_wall.alignment_recovery_distance_mm: 100
    follow_wall.minimum_lateral_clearance_mm: 10
    deposit_lateral_retreat.threshold_mm: 100
    deposit_lateral_retreat.distance_mm: 100
    vision_action: /vision/analyze_scene
    prepare_action: /manipulation/prepare
    pick_action: /manipulation/pick
    store_action: /manipulation/store
    retrieve_action: /manipulation/retrieve
    place_on_table_action: /manipulation/place_on_table
    place_in_container_action: /manipulation/place_in_container
    stack_action: /manipulation/stack
    place_on_precision_table_action: /manipulation/place_on_precision_table
    place_on_shelf_action: /manipulation/place_on_shelf
    vision_led_hold_off_service: /vision/hold_led_off
    server_timeout_s: 10.0
    navigation_timeout_s: 9999999.0
    # Após falha ao navegar saindo de uma área, aguarda o AMCL aplicar a
    # pose cadastrada dessa área antes de reenviar o objetivo ao Nav2.
    navigation_pose_recovery_wait_s: 2.0
    # A recuperação só ocorre se o robô continuar próximo da posição
    # medida pela odometria imediatamente antes de enviar a action de navegação.
    navigation_pose_recovery_radius_m: 0.5
    manipulation_timeout_s: 9999999.0
    # Total attempts per operation, including the first attempt.
    operation_max_attempts: 2
    # Retrieval includes recovery of the empty arm before each retry.
    # Exhaustion stops the mission with cargo preserved instead of skipping it.
    retrieve_max_attempts: 4
    # Additional rounds of pending visits before finish; unresolved failures block finish.
    mission_recovery_rounds: 1
