controller_manager:
  ros__parameters:
    use_sim_time: false
    update_rate: 30
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    base_controller:
      type: mecanum_drive_controller/MecanumDriveController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
      - base_link_to_link1
      - link1_to_link2
      - link2_to_link3
      - link3_to_link4
      - link4_to_link5
      - right_clamp
    interfaces: [position, velocity]

arm_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 30.0
    joints:
      - base_link_to_link1
      - link1_to_link2
      - link2_to_link3
      - link3_to_link4
      - link4_to_link5

gripper_controller:
  ros__parameters:
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 30.0
    joints: [right_clamp]

base_controller:
  ros__parameters:
    reference_timeout: 0.25
    front_left_wheel_command_joint_name: front_left_wheel_joint
    front_right_wheel_command_joint_name: front_right_wheel_joint
    rear_right_wheel_command_joint_name: rear_right_wheel_joint
    rear_left_wheel_command_joint_name: rear_left_wheel_joint
    front_left_wheel_state_joint_name: front_left_wheel_joint
    front_right_wheel_state_joint_name: front_right_wheel_joint
    rear_right_wheel_state_joint_name: rear_right_wheel_joint
    rear_left_wheel_state_joint_name: rear_left_wheel_joint
    kinematics:
      wheels_radius: 0.034
      sum_of_robot_center_projection_on_X_Y_axis: 0.2225
    base_frame_id: base_footprint
    odom_frame_id: odom
    # O EKF é o único publicador de odom -> base_footprint.
    enable_odom_tf: false
    tf_frame_prefix_enable: false

# Optional workstation nodes. These sections are ignored by controller_manager
# and keep upgrades from copy installs to --symlink-install migration-safe.
joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.05
    autorepeat_rate: 20.0
    coalesce_interval_ms: 1

xbox_base_teleop:
  ros__parameters:
    joy_topic: /joy
    cmd_vel_topic: /cmd_vel
    # Linux/Xbox default: A/B/X/Y, left stick X/Y, right stick X, LB/RB.
    axis_linear_x: 1
    axis_linear_y: 0
    axis_angular_z: 3
    enable_button: 5
    turbo_button: 4
    # B cancela goals Nav2; RB continua sendo o deadman do movimento manual.
    cancel_button: 1
    deadzone: 0.10
    max_linear_x: 0.1
    max_linear_y: 0.1
    max_angular_z: 0.6
    max_linear_speed: 0.238
    wheel_linear_speed_limit: 0.238
    kinematic_lever: 0.2225
    turbo_linear_x: 0.23
    turbo_linear_y: 0.23
    turbo_angular_z: 1.0
    publish_rate_hz: 20.0
    joy_timeout_sec: 0.30
