controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 250

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# The position interface in gz_ros2_control converts position error to joint
# velocity. Its default gain (0.1) makes this small arm respond too slowly;
# 1.0 is the largest non-oscillating value supported by this interface.
gz_ros_control:
  ros__parameters:
    position_proportional_gain: 1.0

arm_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    joints:
      - base_link_to_link1
      - link1_to_link2
      - link2_to_link3
      - link3_to_link4
      - link4_to_link5

gripper_controller:
  ros__parameters:
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 50.0
    joints:
      - right_clamp
