base_hardware_node:
  ros__parameters:
    io_rate_hz: 30.0
    command_timeout_sec: 0.30
    # Leituras continuam a 30 Hz; alvos idênticos usam heartbeat de 5 Hz.
    deduplicate_commands: true
    command_heartbeat_hz: 5.0
    max_consecutive_io_failures: 3
    state_topic: /base_hardware/raw_joint_states
    command_topic: /base_hardware/command_velocities

    # O brick permanece na SERIAL0, como no exemplo validado.
    hardware.expansion_serial_port: 3
    hardware.serial_baud_rate: 250000
    hardware.expansion_timeout_sec: 0.005

    # Escala comum de comando: -7..7 rad/s equivale a -100..100.
    hardware.max_wheel_velocity_rad_s: 7.0
    hardware.brick_ticks_per_revolution: 1644
    hardware.expansion_ticks_per_revolution: 3288

    # Rodas da expansão.
    hardware.front_left.motor_id: 0
    hardware.front_left.inverted: true
    # Escalas direcionais gravadas na EEPROM das placas de expansão. Estes
    # valores vêm do procedimento validado da Mariola; o driver só regrava
    # quando detectar diferença.
    hardware.front_left.calibration_clockwise: 88
    hardware.front_left.calibration_counterclockwise: -88
    hardware.front_right.motor_id: 7
    hardware.front_right.inverted: false
    hardware.front_right.calibration_clockwise: 88
    hardware.front_right.calibration_counterclockwise: -88

    # Motores 1 e 2 do brick, nessa ordem.
    hardware.rear_left.inverted: false
    hardware.rear_right.inverted: true
